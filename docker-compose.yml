# Generic Compose file. Copy .env.example to .env and fill it in before starting.
# Nothing here is tied to a particular host, domain, or company.

services:
  invoice-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: invoice-bridge:0.1.0-beta.2
    ports:
      - "127.0.0.1:${INVOICE_BRIDGE_PORT:-8098}:80"
    volumes:
      - bridge-data:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    restart: unless-stopped

  invoice-bridge-scheduler:
    image: invoice-bridge:0.1.0-beta.2
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]
    volumes:
      - bridge-data:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    depends_on:
      - invoice-bridge
    restart: unless-stopped

volumes:
  bridge-data:
