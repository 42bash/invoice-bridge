name: Security

on:
  schedule:
    # Monday 06:17 UTC. Public-repo minutes only; no production secrets.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Composer audit
        run: composer audit --no-interaction

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build -f docker/Dockerfile \
            --build-arg IMAGE_REVISION="${{ github.sha }}" \
            -t invoice-bridge:security .
      - name: Image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: invoice-bridge:security
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
